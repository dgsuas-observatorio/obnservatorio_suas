<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Observatório SUAS — Porto Velho</title>
  <link rel="icon" href="assets/img/favicon.ico" sizes="any">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #0e1b31; text-align: center; background-color: #e3e9f3;
    }
    body::before {
      content: ""; position: fixed; inset: -10%; z-index: 0; pointer-events: none;
      background:
        radial-gradient(48vmax 38vmax at 10% 2%, rgba(35,88,184,.46), transparent 66%),
        radial-gradient(34vmax 28vmax at 54% -8%, rgba(255,210,0,.34), transparent 64%),
        radial-gradient(44vmax 36vmax at 94% 12%, rgba(92,184,90,.40), transparent 64%),
        radial-gradient(42vmax 34vmax at 74% 98%, rgba(35,88,184,.32), transparent 66%);
      filter: blur(14px);
    }
    main {
      position: relative; z-index: 1; max-width: 480px; padding: 44px 36px;
      border-radius: 28px;
      background: rgba(255,255,255,.58);
      -webkit-backdrop-filter: blur(26px) saturate(200%); backdrop-filter: blur(26px) saturate(200%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.7),
                  0 26px 50px -22px rgba(14,27,49,.34), 0 70px 110px -60px rgba(14,27,49,.42);
    }
    .codigo {
      margin: 0; font-size: 76px; font-weight: 800; line-height: 1; letter-spacing: -.05em;
      background: linear-gradient(140deg, #1a4488, #5cb85a 68%, #ffd200);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { margin: 14px 0 10px; font-size: 23px; letter-spacing: -.02em; }
    p { margin: 0 0 24px; color: #3d4d67; line-height: 1.6; font-size: 14.5px; }
    a {
      display: inline-block; padding: 14px 26px; border-radius: 999px;
      background: linear-gradient(145deg, #2358b8, #133468); color: #fff;
      font-weight: 600; text-decoration: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 10px 24px -12px rgba(26,68,136,.62);
    }
    a:focus-visible { outline: 3px solid #0e1b31; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <p class="codigo" aria-hidden="true">404</p>
    <h1>Página não encontrada</h1>
    <p>Este endereço não existe no Observatório SUAS. Você será levado à página inicial em alguns segundos.</p>
    <a id="inicio" href="/">Ir para a página inicial</a>
  </main>
  <script>
    // Em sites de projeto do GitHub Pages (usuario.github.io/repositorio/), a raiz é a 1ª pasta.
    (function () {
      var partes = location.pathname.split('/').filter(Boolean);
      var base = /\.github\.io$/.test(location.hostname) && partes.length ? '/' + partes[0] + '/' : '/';
      if (location.pathname.replace(/\/?$/, '/') === base) base = '/';
      document.getElementById('inicio').href = base;
      setTimeout(function () { location.replace(base); }, 6000);
    })();
  </script>
</body>
</html>
